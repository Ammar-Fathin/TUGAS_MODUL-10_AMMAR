<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Transisi CSS3</title>

    <style type="text/css">
        .box {
            width: 40%;
            height: 100px;
            background-color: orange;
            border: 2px solid #212121;

            /* Menggunakan 'all' agar transisi berlaku untuk lebar, warna, dan border-radius */
            -webkit-transition: all 1s ease-in-out;
            -o-transition: all 1s ease-in-out;
            -moz-transition: all 1s ease-in-out;
            transition: all 1s ease-in-out;
        }

        /* Mode Landscape */
        @media (orientation: landscape) {
            .box {
                width: 100%;
                background-color: blue; /* Mengubah warna objek menjadi biru */
                border-radius: 50%;      /* Mengubah bentuk objek menjadi oval */
            }
        }
    </style>
</head>
<body>
    <h3>Transisi CSS3</h3>
    <div class="box"></div>
    <p>
        Ubah orientasi ke landscape/portrait dan sebaliknya untuk melihat efek transisi!
    </p>
</body>
</html>
