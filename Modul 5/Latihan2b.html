<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desain Responsif dengan Flexbox</title>

    <style type="text/css">
        #wrapper {
            margin: auto;
            width: 100%;
            box-sizing: border-box;
        }

        #header {
            height: 150px;
            padding: 20px;
            border: 2px solid red;
            box-sizing: border-box;
        }

        #nav {
            margin: auto;
            padding: 20px;
            border: 2px solid red;
            box-sizing: border-box;
            
            display: flex;
            flex-wrap: wrap;       
            gap: 20px;           
        }

        #nav h2 {
            width: 100%;
            margin-top: 0;
        }

        .box {
            flex: 1 1 calc(25% - 20px); 
            height: 120px;
            background: red;
            border: 2px solid red;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
            padding: 10px;
        }

        #footer {
            padding: 20px;
            height: 120px;
            border: 2px solid red;
            box-sizing: border-box;
        }

        @media only screen and (max-width: 1080px) {
            .box {
                flex: 1 1 calc(50% - 20px); 
            }
        }

        @media only screen and (max-width: 640px) {
            .box {
                flex: 1 1 100%; 
            }
        }   
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="header">
            <h2>Header</h2>
        </div>
        <div id="nav">
            <h2>Services</h2>
            <div class="box"> BOX 1 </div>
            <div class="box"> BOX 2 </div>
            <div class="box"> BOX 3 </div>
            <div class="box"> BOX 4 </div>
        </div>
        <div id="footer">
            <h2>Footer</h2>
        </div>
    </div>
</body>
</html>
